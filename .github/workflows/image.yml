name: Image

# The container image, published alongside the release it belongs to.
#
# Installing austeris means pulling this, not building Rust on the target
# machine: a Raspberry Pi takes a quarter of an hour over a build that a runner
# does in minutes.
on:
  push:
    tags: ['v*']
  # By hand, before a tag: the image is checked on both architectures - and
  # tried on the stand - while there is still time to fix it without a new
  # version. A tag is irreversible; this is not.
  workflow_dispatch:

permissions:
  contents: read
  # Pushing to GHCR is done with the workflow's own token: no registry password
  # to store, and nothing to rotate.
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            # Native arm64 rather than emulation: a Rust build under QEMU takes
            # the better part of an hour.
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each runner pushes a digest rather than a tag; the manifest below is
      # what gives the two of them one name.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      # The image has to do more than build: it has to start, migrate an empty
      # database and answer. Checked here, on each architecture's own runner,
      # so an arm64 image that builds but cannot run never reaches a tag.
      - name: Start it against an empty database
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker network create smoke
          docker run -d --name db --network smoke \
            -e POSTGRES_USER=austeris -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=austeris \
            postgres:18-alpine
          until docker exec db pg_isready -U austeris -d austeris; do sleep 1; done
          docker run -d --name austeris --network smoke -p 8080:8080 \
            -e AUSTERIS_DATABASE_URL=postgres://austeris:smoke@db:5432/austeris \
            -e AUSTERIS_DEMO=true \
            "$IMAGE@$DIGEST"
          for _ in $(seq 60); do
            curl -fsS http://127.0.0.1:8080/readyz && break
            sleep 2
          done
          curl -fsS -c jar -X POST http://127.0.0.1:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"demo@austeris.local","password":"austeris-demo"}'
          curl -fsS -b jar http://127.0.0.1:8080/api/v1/ledger/balances | grep -q Everyday
          docker logs austeris

      # The file's name is the digest without its `sha256:` prefix, which is
      # what `imagetools create` wants back when it assembles the manifest.
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    name: Publish the manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A tag names the version and moves `latest`: someone who pinned 0.7.0
      # gets that image forever, and someone who wrote `latest` gets whatever
      # shipped last. A run by hand names the commit and moves `edge`, and
      # never touches `latest` - an unreleased build must not reach anyone who
      # did not ask for one.
      - name: Create the multi-architecture tag
        working-directory: /tmp/digests
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags="--tag $IMAGE:${GITHUB_REF_NAME#v} --tag $IMAGE:latest"
          else
            tags="--tag $IMAGE:sha-${GITHUB_SHA::7} --tag $IMAGE:edge"
          fi
          docker buildx imagetools create $tags $(printf "$IMAGE@sha256:%s " *)

      - name: Show what was published
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then name=${GITHUB_REF_NAME#v}; else name=edge; fi
          docker buildx imagetools inspect "$IMAGE:$name"

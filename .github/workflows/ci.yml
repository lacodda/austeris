name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  pull_request:
    paths-ignore: ['docs/**']

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The proto crate compiles the service contracts at build time (ADR 0003).
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release

  # The migration tests skip themselves without a database, so a green matrix
  # above proves nothing about `search_path` scoping or what a rollback leaves
  # behind - the logic that lives in PostgreSQL rather than in Rust. This job
  # is where they actually run, against a database migrated from empty on every
  # push.
  database:
    name: database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: austeris
          POSTGRES_PASSWORD: austeris
          POSTGRES_DB: austeris
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U austeris -d austeris"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AUSTERIS_DATABASE_URL: postgres://austeris:austeris@localhost:5432/austeris
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # A skipped test also reports "ok", so the run is inspected rather than
      # trusted: if the database never reached the tests, this job must fail
      # instead of quietly passing on nothing. The whole suite, not a named
      # list of files - a list silently stops covering the test file added
      # after it was written.
      - name: Test against PostgreSQL
        run: |
          set -o pipefail
          cargo test -- --nocapture 2>&1 | tee output.txt
          if grep -q 'skipped: AUSTERIS_DATABASE_URL is not set' output.txt; then
            echo "::error::the database tests skipped themselves; AUSTERIS_DATABASE_URL did not reach them"
            exit 1
          fi

  # rust-version is a promise to anyone running `cargo install`. Without a job
  # that actually builds on it, the number silently rots the first time a new
  # API is used - so read it from the manifest and hold it to it.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The highest rust-version across the workspace is the one that binds:
      # a single package's number (`packages[0]`) is whichever crate cargo
      # happens to list first, and would let a stricter crate go unchecked.
      - name: Read the workspace MSRV from the manifests
        id: msrv
        run: |
          echo "version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[].rust_version | select(. != null)] | max')" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build on the declared MSRV
        run: cargo check --all-targets

  # The documentation is a storefront: it ships the endpoint reference, and a
  # page that stops building is one nobody notices until a release.
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The site renders its API reference from the spec the binary prints, so
      # building the docs means building the binary (ADR 0006).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: docs
      - name: Build
        run: pnpm build
        working-directory: docs

  # A contract outlives the release that introduced it. This job refuses a
  # change to an existing package that would break a client already speaking
  # it - the answer to needing one is a new package (`identity.v2`), never an
  # edit to `v1` (ADR 0001). Checked against `main` rather than against the
  # previous commit, so a branch cannot break a contract in steps.
  proto:
    name: proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          # The action's own push/PR handling would try to publish to the BSR,
          # which this project does not use: the contracts live in the repo.
          setup_only: true
      - name: Lint
        run: buf lint
      # `continue-on-error` for one commit only: v0.5.0 renames the services to
      # the suffix the linter demands (`IdentityService`), which is by
      # definition a breaking change against the `main` that still carries the
      # old names. Nothing outside this repository speaks these contracts yet -
      # both ends are compiled together - so the rename is cheap now and
      # expensive later. Removed in the next commit, when `main` carries the new
      # names and the gate has something honest to compare against.
      - name: Check for breaking changes
        continue-on-error: true
        run: buf breaking --against "https://github.com/lacodda/austeris.git#branch=main"

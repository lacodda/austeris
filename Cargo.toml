[workspace]
resolver = "3"
members = ["crates/austeris", "crates/common", "crates/identity", "crates/ledger", "crates/market", "crates/proto"]

[workspace.package]
version = "0.8.0"
edition = "2024"
# Measured with `cargo +VERSION check --all-targets`, enforced by the msrv CI
# job, which reads this number from the manifest.
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/lacodda/austeris"
homepage = "https://github.com/lacodda/austeris"
authors = ["Kirill Lakhtachev <lahtachev@gmail.com>"]

[workspace.dependencies]
austeris-common = { path = "crates/common", version = "0.8.0" }
austeris-identity = { path = "crates/identity", version = "0.8.0" }
austeris-ledger = { path = "crates/ledger", version = "0.8.0" }
austeris-market = { path = "crates/market", version = "0.8.0" }
austeris-proto = { path = "crates/proto", version = "0.8.0" }

anyhow = "1.0.104"
# Passwords are human-chosen and worth guessing at scale, so they get a
# memory-hard hash rather than a bare digest. Session tokens, which this server
# issues at full entropy, get SHA-256 instead - there is no dictionary to slow
# an attacker down with.
argon2 = "0.6.0"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.6", features = ["derive"] }
# Session tokens come from the OS entropy source, not from a counter.
rand = "0.10.2"
# Reading a password without echoing it is terminal handling that differs per
# platform - the one case where twenty lines of our own would be twenty lines
# of termios and console-mode bugs.
rpassword = "7.4.0"
# TLS for what leaves the machine: a price source is an HTTPS endpoint on the
# internet, and `austeris add` may talk to an installation behind a TLS
# terminator. `rustls-no-provider` rather than `rustls`, which would bring
# aws-lc-rs and a C toolchain into the arm64 image build; the provider is ring,
# already here for sqlx, and austeris_common::http installs it.
reqwest = { version = "0.13.4", default-features = false, features = ["stream", "query", "rustls-no-provider"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
# `arbitrary_precision` is what actually keeps a price whole. Without it
# serde_json parses every JSON number into an f64 first, and 61234.567890123456
# arrives as 61234.56789012346 - before `Decimal` is ever involved. Verified by
# removing it: two tests in market go red (ADR 0004).
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
prost = "0.14.2"
# Money and quantities are decimal, never binary floating point (ADR 0004):
# a column of floats does not add up, and a ledger that drifts is not a ledger.
rust_decimal = { version = "1.39.0", features = ["db-postgres", "serde-with-str", "serde-with-arbitrary-precision"] }
sha2 = "0.11.0"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "chrono", "uuid", "rust_decimal"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
# gRPC between services (ADR 0003). tonic 0.14 keeps the prost codec in its own
# crate, so the pair moves together.
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# The REST surface describes itself: each service annotates its handlers, the
# gateway merges the pieces into one document and serves it (ADR 0006).
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono", "uuid", "decimal"] }
utoipa-swagger-ui = { version = "10.0.1", features = ["axum", "vendored"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }

# Already in the tree through reqwest and tonic; used by the brand-asset gate
# to inflate the PNGs inside `assets/icon.ico` and look at the actual pixels,
# which is cheaper than taking on an image decoder for one sample.
flate2 = "1.1.10"
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Line-table debug info keeps backtraces readable while cutting the .pdb weight
# that dominates target/debug. Full debug info is a one-line revert when needed.
[profile.dev]
debug = 1

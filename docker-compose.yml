# Development: PostgreSQL, and austeris built from this tree.
#
#   docker compose up
#
# is the whole of it: one container runs every service in one process (ADR
# 0008), and a fictional household is seeded on the first start - so a laptop
# has something to look at, and the documentation's screenshots never carry a
# real number. Sign in as demo@austeris.local / austeris-demo.
#
# `AUSTERIS_DEMO=false docker compose up` gives an empty installation instead;
# on an empty database it creates the first account and prints its password.
# Installing from the published image is `docker-compose.install.yml`.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: austeris
      POSTGRES_PASSWORD: austeris
      POSTGRES_DB: austeris
    ports:
      # Overridable: another PostgreSQL - another project, or a system install -
      # may already hold 5432 on a developer machine.
      - "${AUSTERIS_DB_PORT:-5434}:5432"
    volumes:
      # postgres:18+ images keep data in a version-specific subdirectory; the
      # mount must sit one level up or the entrypoint refuses to start.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U austeris -d austeris"]
      interval: 5s
      timeout: 3s
      retries: 10

  austeris:
    build: .
    command: ["serve"]
    environment:
      AUSTERIS_DATABASE_URL: postgres://austeris:austeris@db:5432/austeris
      AUSTERIS_BIND: 0.0.0.0:8080
      AUSTERIS_DEMO: ${AUSTERIS_DEMO:-true}
      AUSTERIS_FIRST_USER: ${AUSTERIS_FIRST_USER:-owner@austeris.local}
      AUSTERIS_CMC_API_KEY: ${AUSTERIS_CMC_API_KEY:-}
      RUST_LOG: ${RUST_LOG:-austeris=info,tower_http=info,warn}
    ports:
      # The only published port of austeris itself.
      - "${AUSTERIS_PORT:-8084}:8080"
    depends_on:
      db:
        # Not `service_started`: austeris owns schemas, and would race the
        # database and start by failing its first migration.
        condition: service_healthy

volumes:
  db-data:

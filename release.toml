# How austeris is released, read by furca's release engine: `furca release
# plan` says what the next release is and what stands in its way, `furca
# release run` carries it out - bump, changelog, gate, commit, push, green CI,
# tag, publish - and checks what went out. `lyrn check` reads it too.
# Reference: https://lacodda.github.io/furca/reference/release/

[project]
name = "austeris"
changelog = "CHANGELOG.md"
# The workspace root carries the version of every crate and of the path
# dependencies between them; the web interface carries its own copy. Nothing
# else is rewritten by hand: another crate's own number (tower-http) is never
# touched.
manifests = ["Cargo.toml", "web/package.json"]
# ADRs record what happened: the versions they name are history.
as_written = ["docs/adr/"]

[gate]
# Formatting only: it takes seconds and compiles nothing. The rest of the gate
# is CI, which the run waits for before the tag.
commands = [
    "cargo fmt --all --check",
]

[ci]
provider = "github"
workflow = "ci.yml"
# The tag also starts image.yml, which publishes the container image.
publish = "release.yml"

# No crate is published to a registry: the program ships as the archives
# of the release page and as the container image.

# The files the tag's release page has to carry, checked after the publish.
[page]
assets = [
    "austeris-{tag}-x86_64-pc-windows-msvc.zip",
    "austeris-{tag}-x86_64-unknown-linux-gnu.tar.gz",
    "austeris-{tag}-aarch64-unknown-linux-gnu.tar.gz",
]

# No [post.install] and no [post.deploy]: the program is not installed from
# the release page on the maintainer's machine, and the stand is updated by
# hand with `tools/stand/update.sh` after the release is out.

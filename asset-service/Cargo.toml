[package]
name = "asset-service"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
actix-web-validator = "6.0.0"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-native-tls", "time", "chrono", "bigdecimal", "uuid"] }
utoipa = { version = "5.3.1", features = ["actix_extras"] }
tonic = "0.13"
prost = "0.13"
serde = { version = "1.0", features = ["derive"] }
austeris-common = { path = "../austeris-common" }
tokio = { version = "1.35", features = ["full"] }
redis = { version = "0.31", features = ["tokio-comp"] }
env_logger = "0.11"
log = "0.4"
anyhow = "1.0"
validator = { version = "0.18.1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
tonic-build = "0.13"

# The documentation site, a pnpm project of its own beside the web interface.
#
# Advisories against packages deep in the site's build tooling are answered
# here, by the patched release pinned over what the package above asks for,
# until that package takes the patch itself. Each entry says which advisory
# it answers; remove it once `pnpm why` shows the parent on a fixed version.
overrides:
  # form-data below 4.0.6 (high), through starlight-openapi > httpsnippet.
  form-data: ^4.0.6
  # GHSA-rj75-hqrm-r3gf, through starlight > expressive-code > postcss-nested.
  postcss-selector-parser: ^7.1.6

# Before a script runs, pnpm holds node_modules to the lockfile and installs
# what has fallen behind it: a gate run against older packages than the lock
# names passes for something other than what ships.
verifyDepsBeforeRun: install

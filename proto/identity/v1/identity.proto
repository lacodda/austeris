syntax = "proto3";

// The identity service's contract with the rest of austeris.
//
// This is how a service learns who is calling without ever seeing a password:
// it hands over the session token it received and gets back a user id, or
// nothing. Breaking this contract means a new `v2` package, not an edit here
// (ADR 0001).
package identity.v1;

service IdentityService {
  // Resolves a session token to the person holding it.
  rpc ValidateSession(ValidateSessionRequest) returns (ValidateSessionResponse);
  // The person signing in with an address: how a module that is handed
  // something by address - a folder named after its owner - learns whose it
  // is. Nothing about the person beyond their id.
  rpc FindPerson(FindPersonRequest) returns (FindPersonResponse);
}

message FindPersonRequest {
  // The address, in any case.
  string email = 1;
}

message FindPersonResponse {
  // Empty when nobody signs in with that address, or their account is
  // deactivated: either way there are no books of theirs to put anything in.
  string user_id = 1;
}

message ValidateSessionRequest {
  // The opaque token from the session cookie. Never a password.
  string token = 1;
}

message ValidateSessionResponse {
  // Empty when the token is unknown, expired, or its account is deactivated -
  // three cases the caller has no business telling apart.
  string user_id = 1;
  // The address, for a caller that wants to name the actor in a record it
  // writes without asking a second time.
  string email = 2;
}
